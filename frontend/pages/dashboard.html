<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | TaskyXPandz for Business</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">TaskyXPandz</div>
      <nav>
        <a href="#">Dashboard</a>
        <a href="#">Tarefas</a>
        <a href="#">Equipes</a>
        <a href="#">Relatórios</a>
        <a href="#">Configurações</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <button id="theme-toggle">Alternar tema</button>
      </header>
      <main class="content">
        <section class="cards">
  <article class="card">
    <span class="card-label">Tarefas ativas</span>
    <strong class="card-value">24</strong>
  </article>
  <article class="card">
    <span class="card-label">Concluídas</span>
    <strong class="card-value">118</strong>
  </article>
  <article class="card">
    <span class="card-label">Atrasadas</span>
    <strong class="card-value">5</strong>
  </article>
  <article class="card">
    <span class="card-label">Equipe</span>
    <strong class="card-value">12</strong>
  </article>
</section>
