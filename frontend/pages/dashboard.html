<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="aba.dashboard">Dashboard | TaskyXPandz for Business</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">TaskyXPandz</div>
      <nav>
        <a href="dashboard.html" class="ativo">Dashboard</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="equipes.html">Equipes</a>
        <a href="relatorios.html">Relatórios</a>
        <a href="configuracoes.html">Configurações</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 data-i18n="titulo.dashboard">Dashboard</h1>
        <button id="theme-toggle" data-i18n="acao.tema">Alternar tema</button>
      </header>
      <main class="content">
        <section class="cards">
  <article class="card">
    <span class="card-label" data-i18n="card.ativas">Tarefas ativas</span>
    <strong class="card-value" id="stat-ativas">24</strong>
  </article>
  <article class="card">
    <span class="card-label" data-i18n="card.concluidas">Concluídas</span>
    <strong class="card-value" id="stat-concluidas">118</strong>
  </article>
  <article class="card">
    <span class="card-label" data-i18n="card.atrasadas">Atrasadas</span>
    <strong class="card-value" id="stat-atrasadas">5</strong>
  </article>
  <article class="card">
    <span class="card-label" data-i18n="card.equipe">Equipe</span>
    <strong class="card-value">12</strong>
  </article>
</section>
<section class="tasks">
  <h2 data-i18n="lista.recentes">Tarefas recentes</h2><form id="task-form" class="task-form">
  <input id="task-title" data-i18n-placeholder="form.nova" placeholder="Nova tarefa" required />
  <input id="task-owner" data-i18n-placeholder="form.responsavel" placeholder="Responsável" required />
  <input id="task-date" data-i18n-placeholder="form.prazo" placeholder="Prazo (ex: 30/11)" required />
  <button type="submit" data-i18n="form.adicionar">Adicionar</button>
</form>
  <table>
    <thead>
      <tr>
        <th data-i18n="tabela.tarefa">Tarefa</th>
        <th data-i18n="tabela.responsavel">Responsável</th>
        <th data-i18n="tabela.prazo">Prazo</th>
        <th data-i18n="tabela.status">Status</th><th></th>
      </tr>
    </thead>
    <tbody id="tasks-body"></tbody>
  </table>
</section>
      </main>
    </div>
  </div>
   <script src="../js/sidebar.js"></script>
   <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
   <script src="../js/theme.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
