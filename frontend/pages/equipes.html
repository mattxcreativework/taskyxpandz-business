<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="aba.equipes">Equipes | TaskyXPandz for Business</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1 data-i18n="titulo.equipes">Equipes</h1>
        <button id="theme-toggle" data-i18n="acao.tema">Alternar tema</button>
      </header>
      <main class="content">
        <section class="tasks">
          <h2 data-i18n="titulo.equipes">Equipes</h2>
          <p data-i18n="equipes.descricao">Gerencie equipes e membros.</p>

          <form id="form-equipe" class="task-form">
            <input id="equipe-nome" data-i18n-placeholder="equipes.nome" placeholder="Nome da equipe" required />
            <input id="equipe-membros" data-i18n-placeholder="equipes.membros" placeholder="Membros (separados por vírgula)" required />
            <button type="submit" data-i18n="equipes.adicionar">Adicionar equipe</button>
          </form>

          <div id="equipes-lista" class="equipes-grid"></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/equipes.js"></script>
</body>
</html>
