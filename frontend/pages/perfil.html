<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="perfil.titulo">Meu perfil | TaskyXPandz for Business</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1 data-i18n="perfil.titulo">Meu perfil</h1>
        <button id="theme-toggle" data-i18n="acao.tema">Alternar tema</button>
      </header>
      <main class="content">
        <section class="tasks">
          <p data-i18n="perfil.descricao">Seus dados de acesso e preferências.</p>

          <div class="perfil-card">
            <div class="perfil-card-topo">
              <div class="perfil-avatar" id="perfil-avatar">?</div>
              <div>
                <strong id="perfil-nome-exibicao"></strong>
                <small id="perfil-email"></small>
              </div>
            </div>

            <form id="form-perfil">
              <label for="perfil-nome" data-i18n="perfil.nome">Nome</label>
              <input id="perfil-nome" required />

              <label for="perfil-empresa" data-i18n="perfil.empresa">Empresa</label>
              <input id="perfil-empresa" required />

              <button type="submit" data-i18n="perfil.salvar">Salvar alterações</button>
            </form>

            <p id="perfil-mensagem"></p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
