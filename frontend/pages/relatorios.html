<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="aba.relatorios">Relatórios | TaskyXPandz for Business</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h1 data-i18n="titulo.relatorios">Relatórios</h1>
        <button id="theme-toggle" data-i18n="acao.tema">Alternar tema</button>
      </header>
      <main class="content">
        <section class="tasks">
          <h2 data-i18n="titulo.relatorios">Relatórios</h2>
          <p data-i18n="relatorios.descricao">Indicadores calculados a partir das tarefas.</p>

          <div class="cards">
            <article class="card">
              <span class="card-label" data-i18n="relatorios.total">Total de tarefas</span>
              <strong class="card-value" id="rel-total">0</strong>
            </article>
            <article class="card">
              <span class="card-label" data-i18n="card.ativas">Tarefas ativas</span>
              <strong class="card-value" id="rel-andamento">0</strong>
            </article>
            <article class="card">
              <span class="card-label" data-i18n="card.concluidas">Concluídas</span>
              <strong class="card-value" id="rel-concluidas">0</strong>
            </article>
            <article class="card">
              <span class="card-label" data-i18n="card.atrasadas">Atrasadas</span>
              <strong class="card-value" id="rel-atrasadas">0</strong>
            </article>
            <article class="card">
              <span class="card-label" data-i18n="relatorios.taxa">Taxa de conclusão</span>
              <strong class="card-value" id="rel-taxa">0%</strong>
            </article>
          </div>

          <div class="relatorio-blocos">
            <div>
              <h3 data-i18n="tabela.status">Status</h3>
              <div id="rel-barras"></div>
            </div>
            <div>
              <h3 data-i18n="relatorios.porResponsavel">Por responsável</h3>
              <div id="rel-responsaveis"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorios.js"></script>
</body>
</html>
